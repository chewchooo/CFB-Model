/* ---- app.js ---- */
/* CFB Edge -- the scoring model.
 *
 * NEVER TOUCHES `document`, so Node can load it: the backtest scorer and the test
 * suites require this file directly and score the same code the board runs.
 * Rendering lives in ui.js.
 *
 * THE SHAPE OF A GAME PROJECTION, and it is deliberately only two moving parts:
 *
 *     points  =  expected drives  x  points per drive
 *
 * Those are separate facts and are estimated separately. How good an offence is
 * and how many possessions a game contains are close to independent in college
 * football -- Air Force and Tennessee can have identical per-drive efficiency and
 * twenty points of difference in a projected total -- and a model that learns
 * "points per game" has silently mixed them. Splitting them is also what makes a
 * total projectable at all: the margin barely cares about pace, and the total is
 * almost entirely pace times quality.
 *
 * The per-drive rates come from a ridge regression over every drive in the
 * training window (ratings.py). This file never fits anything; it takes the
 * fitted ratings as input and turns them into a game. That split is what lets
 * the browser run the model without shipping 84,000 drives to it.
 *
 * WHAT THIS BOARD CLAIMS AND WHAT IT DOES NOT. Every market carries a verdict
 * measured out of sample, including "this does not beat the market" -- the NFL
 * board's spread model is labelled that way and anything here that earns it is
 * labelled the same. Read `MEASURED` at the bottom, which the backtest writes
 * and the page prints verbatim.
 */

'use strict';

const SCORING = {
  /* -- pace -------------------------------------------------------------
   * Expected offensive drives for EACH team. The two sides of a game get
   * nearly the same number by construction -- possessions alternate -- so a
   * game's drive count is a property of the pairing, not of one team.
   */
  pace: {
    /* The regression constant is NOT here. It lives in ratings.py's CONFIG as
     * `pace_k`, because that is where the per-team pace is computed; keeping a
     * second copy in this file is how the NFL board ended up with one league
     * pass rate in two homes, diverging at runtime.
     *
     * Hard bounds only. An unbounded pace estimate multiplied by an unbounded
     * rate is how projection models produce 90-point totals. */
    min: 8.0,
    max: 15.0,
  },

  /* -- scoring that no drive produces ------------------------------------
   * Pick-sixes, fumble returns, punt returns, safeties. Real points -- about
   * 1,590 of them across 84,000 drives -- and among the least repeatable
   * things in football, so they are added as a LEAGUE CONSTANT to both sides
   * rather than credited to a team. Giving a defence its own non-offensive
   * scoring rate would be fitting to a handful of events per season.
   */
  nonOffense: { perTeam: 0.55 },

  /* -- the floor under a scoring rate ------------------------------------
   * A linear model extrapolates, and past a point it extrapolates into
   * nonsense: the worst matchups on the board came out at -0.82 points per
   * possession, and one FCS side was projected to score MINUS 7.2 points. That
   * is 0.35% of rows, and it is not a small error in a plausible number, it is
   * an impossible number.
   *
   * The floor is not a round guess. Grouped by projected rate across the whole
   * walk-forward, the teams the model priced BELOW zero actually scored 5.0
   * points on ~11.9 possessions, which is a rate of about 0.37:
   *
   *     projected rate    n     projected pts    ACTUAL pts
   *     below 0          27          -1.5            5.0
   *     0.0 - 0.3        62           3.3            8.5
   *     0.3 - 0.6       111           6.4           10.8
   *     0.6 - 0.9       184           9.8           11.2
   *     0.9 - 1.3       453          13.7           15.2
   *     1.3 - 1.8      1199          18.8           19.7
   *
   * Note what that table also says, and the page says it too: the floor stops
   * the impossible values but the ENTIRE low tail is still under-projected, by
   * around four points in the 0.3-0.9 band. The model is unbiased overall
   * (+0.12 points on the total) and biased low on heavy mismatches. Fixing that
   * properly means a non-linear link rather than a clamp, and that is a change
   * worth measuring on its own rather than smuggling in behind a bug fix.
   */
  rateFloor: 0.35,

  /* -- margin -> win probability ----------------------------------------
   * sigma is the standard deviation of (actual margin - projected margin),
   * fitted on held-out games by backtest.js. It is NOT the spread of margins
   * in the league, which is much larger; it is how wrong this model is.
   */
  win: { sigma: 16.4 },

  /* -- the market --------------------------------------------------------
   * Used only to LABEL a disagreement, never as an input to the projection.
   * A model that reads the line and then predicts near it cannot be measured
   * against the line, which is the one comparison that matters here.
   */
  market: {
    /* Points of disagreement before the board says anything at all. Below
     * this the difference is inside the model's own noise. */
    leanPoints: 3.0,
    strongPoints: 7.0,
  },

  /* -- flags -------------------------------------------------------------
   * LABELS, NOT EDGES, unless and until the outcome log says otherwise. This
   * is settled across three boards in this vault: measured flag lifts sit
   * around 1.0 with intervals containing it. They exist to explain why a
   * projection looks the way it does, and the glossary says so.
   */
  /* Thresholds are PERCENTILES OF THE REAL DISTRIBUTION, read off the
   * walk-forward, not round numbers. The first pass used round numbers and
   * THIN EVIDENCE fired on 40% of games while MISMATCH fired on 67% -- a label
   * that decorates two games in three tells a reader nothing. These sit at
   * roughly the 10th and 85th percentiles, so a chip means the game is actually
   * unusual. They are still LABELS, not edges. */
  flags: {
    thinEvidence: 180,     // weighted drives behind the weaker rating; ~p10
    mismatch: 2.3,         // pts/possession net gap; ~p85, about 25 pts a game
    coinFlip: 2.5,         // projected margin inside this is not a real lean
  },
};

// The backtest overwrites this block. Nothing here is a claim until it does.
let MEASURED = null;

/* -------------------------------------------------------------------- */

function num(v) { return (typeof v === 'number' && Number.isFinite(v)) ? v : null; }

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

/* Abramowitz-Stegun 7.1.26. Good to ~1.5e-7, which is four more digits than a
 * win probability derived from a 16-point sigma deserves. */
function erf(x) {
  const s = x < 0 ? -1 : 1;
  x = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - ((((1.061405429 * t - 1.453152027) * t + 1.421413741) * t
    - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
  return s * y;
}

function normCdf(z) { return 0.5 * (1 + erf(z / Math.SQRT2)); }

/* -------------------------------------------------------------------- */

/** Expected offensive drives for each team in this matchup.
 *
 * Both sides get the same number. Football alternates possessions, so the two
 * teams' drive counts in a played game differ by at most one except for
 * end-of-half quirks; projecting them separately would invent a difference the
 * sport does not have.
 */
function projectDrives(ratings, home, away) {
  const lg = num(ratings.pace_league) || 11.0;
  const p = ratings.pace || {};
  const h = num(p[home]);
  const a = num(p[away]);
  const both = [h, a].filter(v => v !== null);
  const est = both.length ? both.reduce((s, v) => s + v, 0) / both.length : lg;
  return clamp(est, SCORING.pace.min, SCORING.pace.max);
}

/** Points per drive for `off` against `def`, from the fitted ratings. */
function pointsPerDrive(ratings, off, def, isHome) {
  const o = num((ratings.off || {})[off]);
  const d = num((ratings.def || {})[def]);
  const mu = num(ratings.mu) || 2.1;
  // An unrated team (a new FBS member, or the pooled FCS side) falls back to
  // the pooled FCS rating rather than to league average -- the teams that are
  // missing from a rating table are missing because they are not FBS, and
  // calling them average would make every September blowout look like an upset.
  const fb = (ratings.off || {}).FCS;
  const fbd = (ratings.def || {}).FCS;
  const oo = o !== null ? o : (num(fb) || 0);
  const dd = d !== null ? d : (num(fbd) || 0);
  const rate = mu + oo + dd + (isHome ? (num(ratings.hfa) || 0) : 0);
  // Expected points on a possession cannot be negative. See SCORING.rateFloor.
  return Math.max(SCORING.rateFloor, rate);
}

/** The whole projection for one game. */
function projectGame(ratings, game) {
  const home = String(game.home);
  const away = String(game.away);
  const neutral = !!game.neutral;
  const drives = projectDrives(ratings, home, away);

  const hRate = pointsPerDrive(ratings, home, away, !neutral);
  const aRate = pointsPerDrive(ratings, away, home, false);

  /* The ratings are fitted on CLEAN drives -- garbage time and end-of-period
   * possessions excluded, because they corrupt a quality estimate -- but a
   * final score contains them. `points_base` and `points_scale` are the
   * two-constant OLS bridge between the two populations, fitted by
   * backtest.py on training games only. Falling back to 0/1 means "no
   * calibration available", which is the right behaviour for a raw ratings
   * table and the wrong number to publish. */
  const base = (typeof ratings.points_base === 'number') ? ratings.points_base
    : SCORING.nonOffense.perTeam;
  const scale = (typeof ratings.points_scale === 'number') ? ratings.points_scale : 1;

  const homePts = base + scale * drives * hRate;
  const awayPts = base + scale * drives * aRate;
  const margin = homePts - awayPts;

  const sigma = (MEASURED && num(MEASURED.sigma)) || SCORING.win.sigma;
  const pHome = normCdf(margin / sigma);

  return {
    id: game.id,
    home, away, neutral,
    drives,
    homeRate: hRate, awayRate: aRate,
    homePoints: homePts, awayPoints: awayPts,
    margin,
    total: homePts + awayPts,
    pHome,
    pAway: 1 - pHome,
    // The board quotes a spread the way a book would: negative means the home
    // side is laying points. `margin` is the home team's expected win amount,
    // so the spread is its negation, and confusing the two is the single
    // easiest way to ship a model that is exactly backwards.
    spread: -margin,
    evidence: Math.min(
      num((ratings.evidence || {})[home]) || 0,
      num((ratings.evidence || {})[away]) || 0),
  };
}

/** Why the projection is what it is, decomposed into points.
 *
 * The margin is an exactly additive function of three differences, which is the
 * one genuinely nice property of fitting offence and defence as separate terms:
 *
 *     margin = [ (OFF_home - OFF_away)      <- offence gap
 *              + (DEF_away - DEF_home)      <- defence gap
 *              + HFA ]                      <- home field
 *              x possessions x scale
 *
 * So "who is favoured and why" is not a story told over the number; it is the
 * number, split into the three parts that produced it, and the parts add back
 * to the whole. Anything that cannot be written that way does not belong here.
 *
 * The one case where it does not add up exactly is a floored rate (see
 * SCORING.rateFloor), which is reported rather than hidden.
 */
function explain(ratings, proj, game) {
  const home = String(game.home), away = String(game.away);
  const neutral = !!game.neutral;
  const R = ratings.off || {}, Dd = ratings.def || {};
  const g = (m, t) => {
    const v = num(m[t]);
    return v !== null ? v : (num(m.FCS) || 0);
  };
  const scale = (typeof ratings.points_scale === 'number' ? ratings.points_scale : 1)
    * proj.drives;

  const offGap = (g(R, home) - g(R, away)) * scale;
  const defGap = (g(Dd, away) - g(Dd, home)) * scale;
  const hfa = (neutral ? 0 : (num(ratings.hfa) || 0)) * scale;

  const parts = [
    { key: 'offence', label: 'Offence', points: offGap },
    { key: 'defence', label: 'Defence', points: defGap },
    { key: 'home', label: neutral ? 'Neutral site' : 'Home field', points: hfa },
  ];
  const sum = offGap + defGap + hfa;
  const floored = Math.abs(sum - proj.margin) > 0.05;

  // Ranked by how much each part actually moved the number.
  const ranked = parts.slice().sort((a, b) => Math.abs(b.points) - Math.abs(a.points));
  return {
    parts, ranked, sum, floored,
    driver: ranked[0],
    // Everything measured in points of margin, from the home team's side.
    residual: proj.margin - sum,
  };
}

/** A plain sentence for the board, built from the decomposition above. */
function reasonFor(ratings, proj, game, nameOf) {
  const nm = nameOf || (t => String(t));
  const ex = explain(ratings, proj, game);
  const favHome = proj.margin >= 0;
  const fav = favHome ? game.home : game.away;
  const dog = favHome ? game.away : game.home;
  const by = Math.abs(proj.margin);
  const flip = favHome ? 1 : -1;      // describe parts from the FAVOURITE's side

  const bits = [];
  for (const p of ex.ranked) {
    const v = p.points * flip;
    if (Math.abs(v) < 0.6) continue;
    if (p.key === 'home') {
      bits.push(v > 0 ? 'home field (+' + v.toFixed(1) + ')'
        : 'playing away (' + v.toFixed(1) + ')');
    } else {
      bits.push((v > 0 ? 'a better ' : 'a worse ') + p.label.toLowerCase()
        + ' (' + (v > 0 ? '+' : '') + v.toFixed(1) + ')');
    }
  }
  const conf = by < 3 ? 'a coin flip'
    : by < 7 ? 'a narrow edge'
      : by < 17 ? 'a clear edge'
        : 'a mismatch';

  let sentence = nm(fav) + ' by ' + by.toFixed(1) + ' over ' + nm(dog)
    + ' — ' + conf + '.';
  if (bits.length) sentence += ' It comes from ' + bits.join(', ') + '.';
  if (ex.floored) {
    sentence += ' One side is at the scoring floor, so the parts do not quite sum.';
  }
  return { sentence, explain: ex, confidence: conf };
}

/** How the projection sits against the market, as a LABEL. */
function marketLean(proj, marketSpread, marketTotal) {
  const out = { spreadEdge: null, totalEdge: null, side: null, lean: 'none' };
  const ms = num(marketSpread);
  if (ms !== null) {
    // Both are quoted home-negative, so a positive edge means this model likes
    // the home side by more than the book does.
    out.spreadEdge = ms - proj.spread;
    const a = Math.abs(out.spreadEdge);
    out.side = out.spreadEdge > 0 ? 'home' : 'away';
    out.lean = a >= SCORING.market.strongPoints ? 'strong'
      : (a >= SCORING.market.leanPoints ? 'lean' : 'none');
  }
  const mt = num(marketTotal);
  if (mt !== null) out.totalEdge = proj.total - mt;
  return out;
}

/** Descriptive chips. Labels, not edges -- see SCORING.flags. */
function flagsFor(ratings, proj, game) {
  const f = [];
  const why = [];
  if (proj.evidence < SCORING.flags.thinEvidence) {
    f.push('THIN EVIDENCE');
    why.push('One of these teams has few drives behind its rating, so the '
      + 'projection is closer to league average than to a real read.');
  }
  const net = (proj.homeRate - proj.awayRate);
  if (Math.abs(net) >= SCORING.flags.mismatch) {
    f.push('MISMATCH');
    why.push('A wide per-possession gap — about '
      + Math.abs(net * proj.drives).toFixed(0) + ' points over a game. These are '
      + 'the games where garbage time arrives early, which is exactly the part '
      + 'of the game the ratings exclude.');
  }
  if (Math.abs(proj.margin) <= SCORING.flags.coinFlip) {
    f.push('COIN FLIP');
    why.push('The projected margin is inside the model’s own noise. A '
      + 'win probability near 50% here is the honest answer, not a weak read.');
  }
  if (game && (String(game.home) === 'FCS' || String(game.away) === 'FCS')) {
    f.push('FCS OPPONENT');
    why.push('One side is not an FBS team. Non-FBS opponents share a single '
      + 'pooled rating, because no individual one plays enough FBS teams to '
      + 'earn its own — so this projection is about the FBS side only.');
  }
  if (game && game.neutral) {
    f.push('NEUTRAL SITE');
    why.push('No home bump applied. The fitted home edge is worth about '
      + ((num(ratings.hfa) || 0) * proj.drives).toFixed(1) + ' points a game.');
  }
  return { flags: f, why };
}

/** Score a whole slate. */
function projectSlate(ratings, games) {
  return games.map(g => {
    const p = projectGame(ratings, g);
    p.market = marketLean(p, g.spread, g.market_total);
    const fl = flagsFor(ratings, p, g);
    p.flags = fl.flags;
    p.why = fl.why;
    return p;
  });
}

function setMeasured(m) { MEASURED = m || null; }
function getMeasured() { return MEASURED; }

/* Node loads this to score the backtest and run the suites; the browser loads
 * the same file with a script tag. One file, one model, both environments --
 * which is the only way the page and the measurement cannot drift apart. */
const CFBEdge = {
  SCORING,
  projectGame, projectSlate, projectDrives, pointsPerDrive,
  marketLean, flagsFor, explain, reasonFor,
  setMeasured, getMeasured,
  normCdf, erf, clamp, num,
};

if (typeof module !== 'undefined' && module.exports) {
  module.exports = CFBEdge;
}
if (typeof window !== 'undefined') {
  window.CFBEdge = CFBEdge;
  if (typeof window.CFB_MEASURED !== 'undefined') setMeasured(window.CFB_MEASURED);
}

/* ---- ui.js ---- */
/* CFB Edge -- rendering.
 *
 * The only file that touches `document`. Every number it shows comes from
 * `app.js`, so the page cannot disagree with the backtest: one model, two
 * callers.
 *
 * WHAT THE LAYOUT IS FOR. A slate is 75 games and nobody reads 75 of anything.
 * The board is therefore a RANKING by default -- most confident pick first,
 * grouped into bands -- because "which of these does the model actually know
 * something about" is the first question anyone has, and a list sorted by
 * kickoff time answers a different one.
 *
 * Every row states its reasoning WITHOUT being opened, because a reason behind
 * a disclosure triangle is a reason nobody reads. The margin decomposes exactly
 * into offence, defence and home field (see `explain` in app.js), so the three
 * numbers on the row add up to the pick above them. That is the whole argument,
 * visible at a glance, and it is checkable.
 *
 * The board's job is not to look confident. It shows a projection, shows what
 * the projection is measured to be worth, and makes the difference impossible
 * to miss -- which is why the verdict strip sits above the games and says
 * "loses to the market" in the same typeface as everything else.
 */

'use strict';

(function () {
  const el = (tag, cls, txt) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt !== undefined && txt !== null) n.textContent = txt;
    return n;
  };

  const D = window.CFB_DATA;
  const CFB = window.CFBEdge;
  const root = document.getElementById('app');

  if (window.CFB_LOAD_ERR || !D || !CFB) {
    root.innerHTML = '';
    const p = el('div', 'empty');
    p.append(el('p', null, 'Could not load ' + (window.CFB_LOAD_ERR || 'the board data') + '.'));
    p.append(el('p', null, 'dashboard.html, data.js, app.js and ui.js must sit in the '
      + 'same folder.'));
    root.append(p);
    return;
  }

  if (D.measured) CFB.setMeasured(D.measured);

  const TEAMS = D.teams || {};

  /* Non-FBS opponents share one pooled RATING, which is the right modelling
   * choice and the wrong thing to print: a row reading "FCS opponent at Oregon"
   * hides who is playing. ESPN's event name carries both real names, so the
   * DISPLAY name comes from there while the rating stays pooled. */
  function realNames(g) {
    const parts = String((g && g.name) || '').split(' at ');
    return parts.length === 2 ? { away: parts[0].trim(), home: parts[1].trim() } : null;
  }
  const nameOf = (id, g, side) => {
    if (TEAMS[id] && TEAMS[id].name) return TEAMS[id].name;
    const r = realNames(g);
    if (r && side) return r[side];
    return id === 'FCS' ? 'FCS opponent' : String(id);
  };
  const abbrOf = (id, g, side) => {
    if (TEAMS[id] && TEAMS[id].abbr) return TEAMS[id].abbr;
    const n = nameOf(id, g, side);
    const w = n.split(/\s+/).filter(Boolean);
    return (w.length ? w[0] : String(id)).slice(0, 4).toUpperCase();
  };
  /* A team colour is only usable if it is visible against the page it is drawn
   * on. Iowa's primary is black and Oregon's is very nearly so; on the dark
   * theme those bars vanished entirely, which is worse than a generic colour
   * because the reader sees an EMPTY bar and reads it as a low probability.
   * So: measure the luminance, and fall back to the team's alternate colour and
   * then to the accent when the primary is too close to the surface. */
  /* READ THE APPLIED THEME, NOT THE OS. This was `const DARK = matchMedia(...)`,
   * evaluated once at load, which was correct only while the theme could not be
   * chosen. With a chooser it is actively wrong: forcing dark on a light-OS
   * machine would keep the LIGHT threshold, Iowa's black would pass usable(),
   * and the bar would vanish into the dark panel -- exactly the bug the
   * luminance check was added to fix, reintroduced by the feature that made the
   * theme selectable. A theme toggle is not a pure CSS change on any page that
   * picks colours in JS. */
  const isDark = () => (window.CFB_THEME
    ? window.CFB_THEME.isDark()
    : document.documentElement.getAttribute('data-theme') === 'dark');

  function luminance(hex) {
    const h = String(hex || '').replace('#', '');
    if (h.length !== 6) return null;
    const v = [0, 2, 4].map(i => {
      const c = parseInt(h.slice(i, i + 2), 16) / 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }

  function usable(hex) {
    const L = luminance(hex);
    if (L === null) return false;
    // The bar sits on --panel-3: near-black in dark mode, near-white in light.
    return isDark() ? L > 0.045 : L < 0.75;
  }

  const colorOf = (id) => {
    const t = TEAMS[id];
    if (!t) return 'var(--accent)';
    if (usable(t.color)) return '#' + t.color;
    if (usable(t.alt)) return '#' + t.alt;
    return 'var(--accent)';
  };

  const fmt = (v, d) => (typeof v === 'number' && Number.isFinite(v))
    ? v.toFixed(d === undefined ? 1 : d) : '--';
  const signed = (v, d) => (typeof v === 'number' && Number.isFinite(v))
    ? (v > 0 ? '+' : '') + v.toFixed(d === undefined ? 1 : d) : '--';
  /* Never print 100%. A model that has been wrong 26% of the time has no
   * business claiming certainty, and a rounded 99.6 shown as "100%" is the
   * single most over-confident thing a probability board can do. */
  const pc = (v, d) => {
    if (!(typeof v === 'number' && Number.isFinite(v))) return '--';
    const p = 100 * v;
    if (p >= 99.5) return '>99%';
    if (p <= 0.5) return '<1%';
    return p.toFixed(d || 0) + '%';
  };

  /* -- project once, decorate once ------------------------------------- */

  const rows = CFB.projectSlate(D.ratings, D.games).map((p, i) => {
    const g = D.games[i];
    p.game = g;
    p.confidence = Math.max(p.pHome, p.pAway);
    p.favIsHome = p.margin >= 0;
    p.favId = p.favIsHome ? p.home : p.away;
    p.dogId = p.favIsHome ? p.away : p.home;
    p.favSide = p.favIsHome ? 'home' : 'away';
    p.dogSide = p.favIsHome ? 'away' : 'home';
    p.ex = CFB.explain(D.ratings, p, g);
    p.reason = CFB.reasonFor(D.ratings, p, g, id => nameOf(id, g,
      id === String(g.home) ? 'home' : 'away'));
    return p;
  });
  rows.sort((a, b) => b.confidence - a.confidence);
  rows.forEach((p, i) => { p.rank = i + 1; });

  /* Bands, by win probability. The cut points are where the language changes,
   * not round numbers for their own sake: 90%+ is "the model would be surprised",
   * 60% is roughly where a one-score game becomes a two-score one, and below
   * 55% the projected margin is inside the model's own error. */
  const BANDS = [
    { key: 'lock', lo: 0.90, title: 'Near-certain',
      note: 'The model would be surprised. These are mostly mismatches against '
        + 'non-FBS or bottom-tier opponents, and they are also the easiest games '
        + 'in the sport to call — getting them right is not evidence of much.' },
    { key: 'strong', lo: 0.75, title: 'Strong favourite',
      note: 'A clear gap in quality. This is where the model earns its margin '
        + 'over simply picking the home team.' },
    { key: 'lean', lo: 0.60, title: 'Favoured',
      note: 'A real but modest edge — roughly a one-score game.' },
    { key: 'close', lo: 0.55, title: 'Slight lean',
      note: 'The edge is small relative to how wrong this model typically is '
        + '(13.4 points of margin error). Treat the side as a lean, not a read.' },
    { key: 'flip', lo: 0.0, title: 'Coin flip',
      note: 'The projected margin is inside the model’s own noise. A number '
        + 'near 50% here is the honest answer, not a weak one.' },
  ];
  const bandOf = p => BANDS.find(b => p.confidence >= b.lo) || BANDS[BANDS.length - 1];

  /* -- state ------------------------------------------------------------ */

  const state = { sort: 'confidence', filter: '', only: 'all', open: {} };
  try {
    const s = localStorage.getItem('cfb-edge-view');
    if (s) Object.assign(state, JSON.parse(s), { open: {} });
  } catch (e) { /* private window or blocked storage -- defaults are fine */ }
  const save = () => {
    try {
      const { open, ...rest } = state;
      localStorage.setItem('cfb-edge-view', JSON.stringify(rest));
    } catch (e) { /* nothing to do, and nothing depends on it */ }
  };

  /* -- header and verdicts ---------------------------------------------- */

  function header() {
    const h = el('header');
    const h1 = el('h1');
    h1.append(document.createTextNode('CFB '));
    h1.append(el('b', null, 'Edge'));
    h.append(h1);
    h.append(el('span', 'sub', D.mode === 'replay'
      ? 'Week ' + D.week + ', ' + D.season + ' — already played, shown with results'
      : 'Week ' + D.week + ', ' + D.season + ' · ' + rows.length + ' games'));
    h.append(el('span', 'stamp', 'built ' + String(D.generated || '').replace('T', ' ')));
    h.append(themeButton());
    return h;
  }

  /* Dark -> Light -> System, in that order because dark is the default and the
   * second press should be the other one, not the clever one. "System" is last
   * and is a real setting rather than the absence of one: without it, a viewer
   * who wants light on a dark-OS machine cannot be told apart from a viewer who
   * has never chosen. */
  const THEME_ORDER = ['dark', 'light', 'system'];
  const THEME_LABEL = { dark: 'Dark', light: 'Light', system: 'System' };

  function themeButton() {
    const t = window.CFB_THEME;
    const b = el('button', 'theme');
    b.type = 'button';
    if (!t) { b.hidden = true; return b; }   // no head script: nothing to drive

    const paint = () => {
      const p = t.get();
      b.setAttribute('data-pref', p);
      b.textContent = '';
      b.append(el('span', 'dot'));
      b.append(el('span', null, THEME_LABEL[p]));
      b.title = 'Theme: ' + THEME_LABEL[p] + (p === 'system'
        ? ' (following your device)' : '') + ' — click to change';
      b.setAttribute('aria-label', b.title);
    };

    b.addEventListener('click', () => {
      t.set(THEME_ORDER[(THEME_ORDER.indexOf(t.get()) + 1) % THEME_ORDER.length]);
      render();          // team colours are chosen against the surface, not by CSS
    });

    // The OS flipping while "system" is selected has to repaint for the same
    // reason a click does.
    t.onChange = () => render();

    paint();
    return b;
  }

  function lede() {
    const m = D.measured;
    const n = el('div', 'lede');
    if (!m) {
      n.append(el('strong', null, 'Unmeasured. '));
      n.append(document.createTextNode('measured.json is missing, so nothing here '
        + 'has a verdict attached. Run backtest.py, then `node backtest.js --write`.'));
      return n;
    }
    const w = m.winner;
    n.append(el('strong', null, 'Read this first. '));
    n.append(document.createTextNode(
      'Games are ranked by how confident the model is, not by kickoff. It calls '
      + 'straight-up winners ' + pc(w.model.point) + ' of the time against '
      + pc(w.alwaysHome.point) + ' for simply picking the home team — an edge of '
      + signed(100 * w.edge.point, 1) + ' points, and its probabilities are calibrated, '
      + 'so a 70% here really does win about 70% of the time. It does NOT beat the '
      + 'betting market: it is ' + fmt(m.market ? m.market.diff.point : 0, 2)
      + ' points of margin error worse than the closing spread and its record against '
      + 'the spread is ' + pc(m.market ? m.market.ats.point : 0) + ', a coin flip. '
      + 'Use it to understand a matchup, not to beat a book.'));
    return n;
  }

  function verdicts() {
    const m = D.measured;
    if (!m) return el('div');
    const v = el('div', 'verdict');
    const card = (lab, big, cmp, cls) => {
      const c = el('div', 'v' + (cls ? ' ' + cls : ''));
      c.append(el('div', 'lab', lab));
      c.append(el('div', 'big', big));
      c.append(el('div', 'cmp', cmp));
      return c;
    };
    const w = m.winner;
    v.append(card('Picks the winner', pc(w.model.point),
      'vs ' + pc(w.alwaysHome.point) + ' picking the home team every time', 'good'));
    v.append(card('Typical margin miss', fmt(m.margin.mae.point, 1) + ' pts',
      'how far off the projected margin usually is'));
    if (m.market) {
      v.append(card('vs the closing spread', signed(m.market.diff.point, 2) + ' pts',
        m.market.diff.lo > 0
          ? 'worse than the market, whose own miss is ' + fmt(m.market.marketMae.point, 1)
          : 'inside the market’s noise',
        m.market.diff.lo > 0 ? 'bad' : ''));
      v.append(card('Against the spread', pc(m.market.ats.point),
        'break-even is 52.4%; this does not reach it', 'bad'));
    }
    return v;
  }

  /* -- controls ---------------------------------------------------------- */

  function controls(onChange, onFilter) {
    const c = el('div', 'controls');
    const seg = (label, key, val, title) => {
      const b = el('button', 'seg', label);
      b.type = 'button';
      if (title) b.title = title;
      b.setAttribute('aria-pressed', String(state[key] === val));
      b.addEventListener('click', () => { state[key] = val; save(); onFilter(); });
      return b;
    };
    const grp = el('div', 'grp');
    grp.append(el('span', 'glab', 'Order'));
    grp.append(seg('Confidence', 'sort', 'confidence', 'Most confident pick first'));
    grp.append(seg('Kickoff', 'sort', 'time', 'Earliest game first'));
    grp.append(seg('Closest', 'sort', 'close', 'Tightest games first'));
    grp.append(seg('vs market', 'sort', 'edge', 'Biggest disagreement with the book'));
    c.append(grp);

    const grp2 = el('div', 'grp');
    grp2.append(el('span', 'glab', 'Show'));
    grp2.append(seg('All', 'only', 'all'));
    grp2.append(seg('FBS only', 'only', 'fbs', 'Hide games against non-FBS opponents'));
    grp2.append(seg('Priced', 'only', 'priced', 'Only games with a betting line'));
    grp2.append(seg('Close ones', 'only', 'close', 'Win probability under 65%'));
    c.append(grp2);

    const s = el('input');
    s.type = 'search';
    s.placeholder = 'Find a team…';
    s.value = state.filter;
    s.setAttribute('aria-label', 'Filter by team');
    s.addEventListener('input', () => { state.filter = s.value; save(); onFilter(); });
    c.append(s);
    return c;
  }

  /* -- one game ---------------------------------------------------------- */

  function probBar(p) {
    const bar = el('div', 'bar');
    bar.setAttribute('role', 'img');
    bar.setAttribute('aria-label', abbrOf(p.favId, p.game, p.favSide) + ' '
      + pc(p.confidence) + ' to win');
    const fill = el('div', 'fill');
    fill.style.width = (100 * p.confidence).toFixed(1) + '%';
    fill.style.background = colorOf(p.favId);
    bar.append(fill);
    // The 50% mark, so a bar just past it reads as "barely" rather than "half".
    bar.append(el('div', 'mid'));
    return bar;
  }

  function gameCard(p) {
    const g = p.game;
    const card = el('article', 'game');
    const head = el('button', 'head');
    head.type = 'button';
    head.setAttribute('aria-expanded', String(!!state.open[p.id]));

    const rank = el('div', 'rank');
    rank.append(el('div', 'rk', '#' + p.rank));
    rank.append(el('div', 'rkp', pc(p.confidence)));
    head.append(rank);

    const mid = el('div', 'mid-col');

    const pick = el('div', 'pick');
    const sw = el('span', 'swatch');
    sw.style.background = colorOf(p.favId);
    pick.append(sw);
    pick.append(el('span', 'fav', nameOf(p.favId, g, p.favSide)));
    pick.append(el('span', 'by', 'by ' + fmt(Math.abs(p.margin), 1)));
    mid.append(pick);

    const over = el('div', 'over');
    over.append(document.createTextNode('over '));
    over.append(el('span', 'dog', nameOf(p.dogId, g, p.dogSide)));
    const played = typeof g.home_score === 'number' && typeof g.away_score === 'number';
    if (played) {
      const favScore = p.favIsHome ? g.home_score : g.away_score;
      const dogScore = p.favIsHome ? g.away_score : g.home_score;
      const hit = favScore > dogScore;
      const res = el('span', 'result ' + (hit ? 'hit' : 'miss'),
        (hit ? '✓ ' : '✗ ') + favScore + '–' + dogScore);
      over.append(res);
    }
    mid.append(over);

    mid.append(probBar(p));

    /* The reasoning, on the row. Three numbers that add to the margin above. */
    const why = el('div', 'why');
    const flip = p.favIsHome ? 1 : -1;
    for (const part of p.ex.parts) {
      const v = part.points * flip;
      const b = el('span', 'part ' + (v >= 0 ? 'up' : 'down'));
      b.append(el('span', 'pl', part.label));
      b.append(el('span', 'pv', signed(v, 1)));
      b.title = part.label + ' is worth ' + signed(v, 1) + ' points of the projected '
        + 'margin, from ' + abbrOf(p.favId, g, p.favSide) + '’s side. The three add '
        + 'up to the ' + fmt(Math.abs(p.margin), 1) + ' above.';
      why.append(b);
    }
    mid.append(why);

    /* Star players, on the row. CONTEXT, never an input -- the model is
     * team-level and has never seen a player. The value is that "Indiana by
     * 44.9" is a number and a name beside it is an explanation. */
    const P = D.players || {};
    const stars = el('div', 'stars');
    for (const [id, side] of [[p.favId, p.favSide], [p.dogId, p.dogSide]]) {
      const list = P[id];
      if (!list || !list.length) continue;
      const pick = list.find(x => x.cat === 'Passing') || list[0];
      if (!pick) continue;
      const s = el('span', 'star');
      s.append(el('span', 'sabbr', abbrOf(id, g, side)));
      s.append(el('span', 'sname', pick.name));
      if (pick.pos) s.append(el('span', 'spos', pick.pos));
      s.append(el('span', 'sline', pick.line || ''));
      stars.append(s);
    }
    if (stars.childNodes.length) mid.append(stars);

    const meta = el('div', 'meta');
    if (g.date) {
      const d = new Date(g.date);
      meta.append(el('span', null, isNaN(d) ? g.date
        : d.toLocaleString(undefined, { weekday: 'short', month: 'short',
                                        day: 'numeric', hour: 'numeric', minute: '2-digit' })));
    }
    meta.append(el('span', null, g.neutral ? 'neutral site'
      : 'at ' + abbrOf(p.home, g, 'home')));
    if (typeof g.spread === 'number') {
      const d = p.market.spreadEdge;
      meta.append(el('span', 'mkt', 'book: ' + abbrOf(p.home, g, 'home') + ' '
        + signed(g.spread, 1) + (Math.abs(d) >= 3
          ? ' · model differs by ' + fmt(Math.abs(d), 1) : '')));
    } else {
      meta.append(el('span', 'mkt', 'no line'));
    }
    for (const f of p.flags) meta.append(el('span', 'chip', f));
    mid.append(meta);
    head.append(mid);

    const right = el('div', 'proj');
    right.append(el('div', 'score',
      fmt(p.favIsHome ? p.homePoints : p.awayPoints, 0) + '–'
      + fmt(p.favIsHome ? p.awayPoints : p.homePoints, 0)));
    right.append(el('div', 'tot', 'total ' + fmt(p.total, 1)));
    right.append(el('div', 'more', 'details'));
    head.append(right);

    card.append(head);

    let body = null;
    const toggle = () => {
      const open = !state.open[p.id];
      state.open[p.id] = open;
      head.setAttribute('aria-expanded', String(open));
      if (open) {
        if (!body) { body = detail(p); card.append(body); }
        body.hidden = false;
      } else if (body) body.hidden = true;
    };
    head.addEventListener('click', toggle);
    if (state.open[p.id]) { body = detail(p); card.append(body); }
    return card;
  }

  function detail(p) {
    const g = p.game;
    const d = el('div', 'detail');

    d.append(el('p', 'sentence', p.reason.sentence));

    const grid = el('div', 'grid2');
    const mk = (title, pairs) => {
      const box = el('div');
      box.append(el('h4', null, title));
      const t = el('table', 'k');
      for (const [k, v] of pairs) {
        const tr = el('tr');
        tr.append(el('td', null, k));
        tr.append(el('td', null, v));
        t.append(tr);
      }
      box.append(t);
      return box;
    };

    grid.append(mk('How the margin is built', [
      ['Offence gap', signed(p.ex.parts[0].points, 1) + ' pts'],
      ['Defence gap', signed(p.ex.parts[1].points, 1) + ' pts'],
      [g.neutral ? 'Neutral site' : 'Home field', signed(p.ex.parts[2].points, 1) + ' pts'],
      ['Projected margin', signed(p.margin, 1) + ' ' + abbrOf(p.home, g, 'home')],
      ['Expected possessions each', fmt(p.drives, 1)],
      ['Projected score', fmt(p.awayPoints, 1) + ' – ' + fmt(p.homePoints, 1)],
    ]));

    const market = [];
    if (typeof g.spread === 'number') {
      market.push(['Closing spread (' + (g.n_books || 0) + ' book'
        + (g.n_books === 1 ? '' : 's') + ')',
        abbrOf(p.home, g, 'home') + ' ' + signed(g.spread, 1)]);
      market.push(['This model', abbrOf(p.home, g, 'home') + ' ' + signed(p.spread, 1)]);
      market.push(['Disagreement', fmt(Math.abs(p.market.spreadEdge), 1) + ' pts']);
    } else {
      market.push(['Closing spread', 'not priced']);
    }
    if (typeof g.market_total === 'number') {
      market.push(['Market total', fmt(g.market_total, 1)]);
      market.push(['Model total', fmt(p.total, 1)]);
    }
    market.push(['Win probability', abbrOf(p.favId, g, p.favSide) + ' ' + pc(p.confidence, 1)]);
    market.push(['Rating evidence', fmt(p.evidence, 0) + ' weighted drives']);
    grid.append(mk('The market, and how sure the model is', market));
    d.append(grid);

    if (p.why && p.why.length) {
      d.append(el('h4', null, 'What the labels mean here'));
      for (const w of p.why) d.append(el('p', null, w));
    }

    const P = D.players || {};
    for (const [id, side] of [[p.favId, p.favSide], [p.dogId, p.dogSide]]) {
      const list = P[id];
      if (!list || !list.length) continue;
      d.append(el('h4', null, nameOf(id, g, side) + ' — who is doing the work'));
      const t = el('table', 'k');
      for (const row of list) {
        const tr = el('tr');
        const who = el('td');
        who.append(el('span', 'scat', row.cat));
        who.append(document.createTextNode(' '
          + row.name + (row.pos ? ' (' + row.pos + ')' : '')));
        tr.append(who);
        tr.append(el('td', null, row.line || ''));
        t.append(tr);
      }
      d.append(t);
    }
    if (Object.keys(P).length) {
      d.append(el('p', 'fine', 'Players are shown for context and are NOT inputs: the '
        + 'model is team-level and has never seen a roster. A quarterback having a great '
        + 'season is already inside his offence’s points per possession. The honest '
        + 'caveat runs the other way — if one of these players does not play, the '
        + 'projection is wrong in a direction this board cannot see, because the rating '
        + 'behind it was earned partly by him.'));
    }

    const form = D.form || {};
    for (const id of [p.favId, p.dogId]) {
      const f = form[id];
      if (!f || !f.length) continue;
      d.append(el('h4', null, nameOf(id, g, id === String(g.home) ? 'home' : 'away')
        + ' — recent results'));
      const line = f.map(x => (x.w ? 'W' : 'L') + ' ' + x.pf + '-' + x.pa + ' '
        + (x.h ? 'vs ' : 'at ') + abbrOf(x.o)).join('   ·   ');
      d.append(el('p', null, line));
    }

    d.append(el('p', 'fine', 'Recent results are shown for context and are NOT an input: '
      + 'the rating already contains every one of these games, opponent-adjusted. '
      + 'The spread is a median of pregame sportsbooks and the model never reads it.'));
    return d;
  }

  /* -- ratings table ------------------------------------------------------ */

  function ratingsTable() {
    const R = D.ratings;
    const list = Object.keys(R.off || {}).filter(t => t !== 'FCS').map(t => ({
      t, off: R.off[t], def: R.def[t], net: R.off[t] - R.def[t],
      pace: (R.pace || {})[t], ev: (R.evidence || {})[t] || 0,
    })).sort((a, b) => b.net - a.net);

    const wrap = el('details', 'gloss');
    wrap.append(el('summary', null, 'All ' + list.length
      + ' team ratings — points per possession against an average opponent'));
    const tw = el('div', 'tablewrap');
    const tb = el('table', 'rank-t');
    const thead = el('thead');
    const htr = el('tr');
    for (const h of ['#', 'Team', 'Net', 'Offence', 'Defence', 'Pace', 'Evidence']) {
      htr.append(el('th', null, h));
    }
    thead.append(htr);
    tb.append(thead);
    const tbody = el('tbody');
    list.forEach((r, i) => {
      const tr = el('tr');
      tr.append(el('td', null, String(i + 1)));
      tr.append(el('td', null, nameOf(r.t)));
      const cell = v => el('td', v > 0 ? 'pos' : 'neg', signed(v, 3));
      tr.append(cell(r.net));
      tr.append(cell(r.off));
      tr.append(cell(-r.def));   // a negative coefficient means fewer points allowed
      tr.append(el('td', null, fmt(r.pace, 1)));
      tr.append(el('td', null, fmt(r.ev, 0)));
      tbody.append(tr);
    });
    tb.append(tbody);
    tw.append(tb);
    wrap.append(tw);
    return wrap;
  }

  /* -- glossary ----------------------------------------------------------- */

  function glossary() {
    const m = D.measured;
    const g = el('details', 'gloss');
    g.append(el('summary', null, 'How to read this board, and how it was measured'));
    const dl = el('dl');
    const item = (t, body) => { dl.append(el('dt', null, t)); dl.append(el('dd', null, body)); };

    item('The three numbers on every row',
      'Offence, Defence and Home field, in points, from the favourite’s side. '
      + 'They are not commentary — they add up exactly to the projected margin '
      + 'printed above them, because that is how the model computes it.');
    item('Win probability',
      'Calibrated, and checked: across ' + (m ? m.games : 0) + ' out-of-sample games, '
      + 'the games this model called at 70% were won about 70% of the time, and the '
      + 'same at every other level. A 55% is genuinely close, not a hedge.');
    item('Why the near-certain games are not impressive',
      'Anyone picks a 45-point favourite. The model’s value is in the middle bands, '
      + 'and the measured edge over "always pick the home team" is where that shows up.');
    item('Points per possession',
      'The model’s unit. Team quality is fitted by ridge regression over every drive '
      + 'in the training window, solving for all teams simultaneously so a rating reflects '
      + 'the opponents faced rather than the schedule drawn. Garbage time and end-of-half '
      + 'drives are excluded — they are possessions, but not evidence about quality.');
    item('Why possessions and not points per game',
      'Tempo and quality are different facts. Two equally good offences post very '
      + 'different point totals if one plays fast. Pace is projected separately.');
    item('Evidence',
      'Weighted drives behind the weaker of the two ratings. Early in a season this is '
      + 'small and ratings sit near league average on purpose — the regression is the '
      + 'prior, not a smoothing afterthought.');
    item('Flags',
      'Descriptive labels, not edges. Across the boards in this project, measured flag '
      + 'lifts sit around 1.0 with intervals containing it.');
    item('Home field',
      'Fitted, not assumed: ' + fmt((D.ratings.hfa || 0) * 11 * (D.ratings.points_scale || 1), 1)
      + ' points over a typical game, applied to the home offence only, zero at a neutral site.');
    if (m) {
      item('How it was measured',
        'A walk-forward over ' + m.games + ' games in ' + (m.seasons || []).join(', ')
        + '. For each week, ratings were fitted only on drives from earlier weeks, then that '
        + 'week was projected. Intervals bootstrap over whole weeks, since games in a week '
        + 'share opponents and one rating snapshot.');
      item('Where it is weakest',
        'Against the market, always. Also in the opening weeks of a season, when a rating is '
        + 'mostly last year’s team — the ' + D.season + ' rows are exactly that case. '
        + 'And it under-projects heavy mismatches: teams it prices near the scoring floor '
        + 'score about four points more than it says.');
    }
    g.append(dl);
    return g;
  }

  /* -- assembly ------------------------------------------------------------ */

  function visible() {
    let list = rows.slice();
    const q = state.filter.trim().toLowerCase();
    if (q) {
      list = list.filter(p => (nameOf(p.home, p.game, 'home') + ' '
        + nameOf(p.away, p.game, 'away') + ' ' + (p.game.name || '')).toLowerCase().includes(q));
    }
    if (state.only === 'priced') list = list.filter(p => typeof p.game.spread === 'number');
    if (state.only === 'fbs') {
      list = list.filter(p => String(p.home) !== 'FCS' && String(p.away) !== 'FCS');
    }
    if (state.only === 'close') list = list.filter(p => p.confidence < 0.65);

    if (state.sort === 'time') {
      list.sort((a, b) => String(a.game.date || '').localeCompare(String(b.game.date || '')));
    } else if (state.sort === 'close') {
      list.sort((a, b) => a.confidence - b.confidence);
    } else if (state.sort === 'edge') {
      list.sort((a, b) => Math.abs((b.market && b.market.spreadEdge) || 0)
        - Math.abs((a.market && a.market.spreadEdge) || 0));
    } else list.sort((a, b) => b.confidence - a.confidence);
    return list;
  }

  /* The list of games, built on its own so it can be repainted WITHOUT the
   * controls above it.
   *
   * The search box is why. It used to call `render()`, which begins by emptying
   * `root` -- so the first keystroke replaced the input element the keystroke
   * had just gone into, focus went with the old node, and the second letter
   * landed nowhere. The board looked like it accepted one character at a time.
   * Restoring focus afterwards would paper over it; not destroying the input is
   * the fix, and it also stops 75 cards being rebuilt for a node that never
   * changes. The filter only ever affects `visible()`, so this is all it needs
   * to touch. */
  let cardsEl = null;

  function buildCards() {
    const list = visible();
    const cards = el('div', 'cards');
    if (!list.length) {
      cards.append(el('div', 'empty', 'No games match that filter.'));
    } else if (state.sort === 'confidence') {
      // Banded, because the ranking's whole point is that the top is easy and
      // the middle is where the model is doing work.
      let last = null;
      for (const p of list) {
        const b = bandOf(p);
        if (b.key !== last) {
          last = b.key;
          const h = el('div', 'band');
          h.append(el('h3', null, b.title));
          h.append(el('p', null, b.note));
          cards.append(h);
        }
        cards.append(gameCard(p));
      }
    } else {
      for (const p of list) cards.append(gameCard(p));
    }
    return cards;
  }

  function paintCards() {
    if (!cardsEl || !cardsEl.parentNode) { render(); return; }
    const next = buildCards();
    cardsEl.replaceWith(next);
    cardsEl = next;
  }

  function render() {
    root.innerHTML = '';
    root.append(header());
    root.append(lede());
    root.append(verdicts());
    root.append(controls(render, paintCards));

    cardsEl = buildCards();
    root.append(cardsEl);
    root.append(ratingsTable());
    root.append(glossary());

    const f = el('footer');
    const c = D.corpus || {};
    f.append(el('div', null, 'Ratings fitted on ' + (c.drives || 0).toLocaleString()
      + ' drives from ' + (c.games || 0).toLocaleString() + ' games, '
      + (c.seasons || []).join('–') + '. Data: ESPN public feeds. Lines are a median '
      + 'of pregame sportsbooks and are never an input to the model.'));
    f.append(el('div', null, 'CFB Edge · built ' + (D.generated || '')));
    root.append(f);
  }

  render();
})();

</script>
</body>
</html>
